services:
  # Redis 消息队列服务
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - moondance-net

  # MongoDB 数据库服务
  mongodb:
    image: mongo:6.0
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=123456
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - moondance-net

  # MySQL 数据库服务（小程序用户/统计数据）
  mysql:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=MySql@2026Ab
      - MYSQL_DATABASE=moondance
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pMySql@2026Ab"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - moondance-net

  # Nginx 负载均衡
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - moondance-net

  # 后端API服务（默认4个副本，每个副本4个线程）
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.9-slim}
    restart: always
    command: gunicorn -w 2 --threads 4 -b 0.0.0.0:8000 --timeout 60 --access-logfile - --error-logfile - "main_api:create_app()"
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_USE_SSL=0
      - API_CERT_CN=localhost
      - API_KEY=${API_KEY:-myh}
      - JWT_SECRET=${JWT_SECRET:-moon_dance_change_me_please_set_env_32bytes}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123456}
      - ADMIN_TOKEN_EXPIRE_SECONDS=${ADMIN_TOKEN_EXPIRE_SECONDS:-7200}
      - MONGO_URI=mongodb://admin:123456@mongodb:27017/
      - MYSQL_URI=mysql+pymysql://root:MySql%402026Ab@mysql:3306/moondance?charset=utf8mb4
    volumes:
      - api_data:/app/data
      - ../certs:/app/certs:ro
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - moondance-net

  # 异步任务处理Worker
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.9-slim}
    restart: always
    command: celery -A src.core.worker worker --loglevel=info --concurrency=8
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URI=mongodb://admin:123456@mongodb:27017/
      - MYSQL_URI=mysql+pymysql://root:MySql%402026Ab@mysql:3306/moondance?charset=utf8mb4
    volumes:
      - api_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - moondance-net

  # 数据模拟器（自动运行 2000 台设备发数据）
  simulator:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.9-slim}
    restart: always
    command: python3 -u simulator_client.py --api-url http://api:8000/api/v2/ingest --device-count 2000 --interval 1.0 --no-local-store
    depends_on:
      api:
        condition: service_started
    networks:
      - moondance-net

volumes:
  redis_data:
  api_data:
  mongo_data:
  mysql_data:

networks:
  moondance-net:
    driver: bridge
